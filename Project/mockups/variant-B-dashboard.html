<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Остатки реагентов — Вариант B</title>
<style>
  :root{--bg:#0f1b2d;--panel:#16243a;--card:#1c2d47;--ink:#e8eef8;--muted:#93a3bd;--line:#2a3d5c;--accent:#4ea1ff;
        --green:#3ccf7a;--yellow:#f5c142;--red:#ff5c5c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;display:flex;min-height:100vh}
  nav{width:220px;background:var(--panel);padding:20px 14px;flex-shrink:0;border-right:1px solid var(--line)}
  nav .logo{font-weight:700;font-size:16px;margin-bottom:24px;padding:0 8px}
  nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;margin-bottom:4px;cursor:pointer}
  nav a.on,nav a:hover{background:var(--card);color:var(--ink)}
  .wrap{flex:1;padding:20px 24px;min-width:0}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .top h1{margin:0;font-size:20px}
  .pill{margin-left:auto;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
  .pill i{width:8px;height:8px;border-radius:50%;background:var(--green)}
  select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
  .grid{display:grid;grid-template-columns:320px 1fr;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .donut{display:flex;align-items:center;gap:18px}
  .lg div{display:flex;align-items:center;gap:8px;margin:6px 0}
  .lg b{font-size:18px;min-width:26px}
  .sw{width:10px;height:10px;border-radius:3px}
  .bars .row{display:grid;grid-template-columns:minmax(120px,240px) 1fr 52px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
  .bars .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bars .tr{height:14px;background:#24385a;border-radius:4px;position:relative;overflow:hidden}
  .bars .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
  .bars .tr .m50,.bars .tr .m20{position:absolute;top:-2px;bottom:-2px;width:1px;background:#6a7fa3}
  .bars .pc{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .order{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
  .oc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:12px}
  .oc.y{border-left-color:var(--yellow)}
  .oc .t{font-weight:600;margin-bottom:6px}
  .oc .s{color:var(--muted);font-size:12px}
  .oc .q{font-size:22px;font-weight:700;margin-top:6px}
  .rep{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:10px;align-items:end;margin-top:16px}
  .rep label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .rep input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
  .btn{background:var(--accent);color:#06203f;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
  .demo{position:fixed;bottom:10px;right:10px;background:var(--yellow);color:#3a2a00;font-size:11px;padding:4px 10px;border-radius:6px}
  @media(max-width:900px){body{flex-direction:column}nav{width:auto;display:flex;gap:4px;overflow-x:auto;padding:10px}nav .logo{display:none}
    .grid{grid-template-columns:1fr}.rep{grid-template-columns:1fr 1fr}.wrap{padding:16px}}
</style>
</head>
<body>
<nav>
  <div class="logo">🧪 Склад КДЛ</div>
  <a class="on">Обзор остатков</a><a>Нужно заказать</a><a>Отчёты</a><a>Нормы запаса</a><a>Настройки</a>
</nav>
<div class="wrap">
  <div class="top">
    <h1>Обзор остатков</h1>
    <select><option>Лаборатория (КДЛ)</option><option>Аптечный склад</option></select>
    <div class="pill"><i></i><span id="st"></span></div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Состояние запасов</h2>
      <div class="donut"><svg id="dn" width="140" height="140" viewBox="0 0 42 42"></svg><div class="lg" id="lg"></div></div>
    </div>
    <div class="card">
      <h2>Уровень запаса по позициям (% от нормы)</h2>
      <div class="bars" id="bars"></div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h2>Нужно заказать</h2>
    <div class="order" id="ord"></div>
  </div>
  <div class="card" style="margin-top:16px">
    <h2>Отчёт по остаткам из 1С</h2>
    <div class="rep">
      <label>На дату<input type="date" id="dt"></label>
      <label>Склад<select><option>Лаборатория (КДЛ)</option><option>Все склады</option></select></label>
      <label>Вид отчёта<select><option>Остатки на дату</option><option>Движение за период</option><option>Позиции к заказу</option></select></label>
      <label>Формат<select><option>Excel</option><option>PDF</option></select></label>
      <button class="btn" onclick="alert('В рабочей версии: отчёт формируется по данным 1С и скачивается')">Сформировать</button>
    </div>
  </div>
</div>
<div class="demo">МАКЕТ · данные вымышленные</div>
<script>
const D=[["Реагент АЛТ 4×50 мл",1,10,"наб"],["Дилюент гематологический 20 л",2,12,"кан"],["Контрольная кровь",1,4,"наб"],
 ["Краситель Романовского 1 л",1,6,"фл"],["Пробирки с активатором 5 мл",6,40,"уп"],["Креатинин 2×100 мл",2,8,"наб"],
 ["Спирт этиловый 70% 1 л",8,30,"фл"],["Тест HBsAg ИФА 96 т.",2,6,"наб"],["Реагент АСТ 4×50 мл",4,10,"наб"],
 ["Холестерин общий",3,6,"наб"],["Тест ВИЧ 1/2 экспресс",5,10,"наб"],["Перчатки нитриловые M",30,50,"уп"],
 ["Тест-полоски мочевые",14,20,"уп"],["Глюкоза ГОД-ПАП",9,12,"наб"],["Пробирки ЭДТА К3 2 мл",45,60,"уп"],
 ["Иммерсионное масло",3,4,"фл"],["Мочевина 4×50 мл",7,8,"наб"],["Лизирующий реагент",9,10,"фл"]]
 .map(([n,q,m,u])=>{const p=q/m*100;return{n,q,m,u,p,s:p<20?"red":p<50?"yellow":"green"}}).sort((a,b)=>a.p-b.p);
const C={red:"var(--red)",yellow:"var(--yellow)",green:"var(--green)"},L={red:"Мало",yellow:"Меньше среднего",green:"Достаточно"};
const cnt=s=>D.filter(d=>d.s===s).length;
let off=25,svg='<circle cx="21" cy="21" r="15.9" fill="none" stroke="#24385a" stroke-width="5"/>';
["red","yellow","green"].forEach(s=>{const v=cnt(s)/D.length*100;svg+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${C[s]}" stroke-width="5" stroke-dasharray="${v} ${100-v}" stroke-dashoffset="${off}"/>`;off-=v});
svg+=`<text x="21" y="22" text-anchor="middle" fill="#e8eef8" font-size="8" font-weight="700">${D.length}</text><text x="21" y="27.5" text-anchor="middle" fill="#93a3bd" font-size="3">позиций</text>`;
dn.innerHTML=svg;
lg.innerHTML=["red","yellow","green"].map(s=>`<div><span class="sw" style="background:${C[s]}"></span><b>${cnt(s)}</b>${L[s]}</div>`).join("");
bars.innerHTML=D.map(d=>`<div class="row"><span class="nm" title="${d.n}">${d.n}</span><span class="tr"><i style="width:${Math.min(d.p,100)}%;background:${C[d.s]}"></i><span class="m20" style="left:20%"></span><span class="m50" style="left:50%"></span></span><span class="pc">${Math.round(d.p)}%</span></div>`).join("");
ord.innerHTML=D.filter(d=>d.s!=="green").map(d=>`<div class="oc ${d.s==="yellow"?"y":""}"><div class="t">${d.n}</div><div class="s">Остаток ${d.q} ${d.u} из нормы ${d.m}</div><div class="q">+${d.m-d.q} ${d.u}</div><div class="s">рекомендуемый заказ</div></div>`).join("");
st.textContent="Синхронизировано с 1С: "+new Date().toLocaleTimeString("ru-RU");
document.getElementById("dt").valueAsDate=new Date();
</script>
</body>
</html>
